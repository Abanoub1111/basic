services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: email_assistant
      POSTGRES_USER: email_assistant_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:${DEMO_DB_PORT:?Set DEMO_DB_PORT for this chapter}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_assistant_demo -d email_assistant"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
