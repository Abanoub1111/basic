services:
  app:
    build: .
    image: email-assistant:local
    env_file:
      - .env
    environment:
      # Containers reach PostgreSQL by service name, not host localhost:5433.
      DATABASE_URL: postgresql+asyncpg://email_assistant:email_assistant@postgres:5432/email_assistant
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: email_assistant
      POSTGRES_USER: email_assistant
      POSTGRES_PASSWORD: email_assistant
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - email-assistant-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_assistant -d email_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  email-assistant-postgres:
